buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // Repositorios oficiales correctos de Aliucord para resolver el plugin
        maven { url "https://maven.aliucord.com/releases/" }
        maven { url "https://maven.aliucord.com/snapshots/" }
    }
    dependencies {
        classpath "com.github.Aliucord:gradle-plugin:main-SNAPSHOT"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // Repositorios oficiales correctos de Aliucord para resolver dependencias internas
        maven { url "https://maven.aliucord.com/releases/" }
        maven { url "https://maven.aliucord.com/snapshots/" }
    }
}

buildscript {
    repositories {
        google()
        mavenCentral()
        // Repositorio espejo para las dependencias personalizadas de Aliucord
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath "com.github.Aliucord:gradle-plugin:main-SNAPSHOT"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

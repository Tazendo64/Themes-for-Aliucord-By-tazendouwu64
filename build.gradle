plugins {
    id 'com.android.library'
    id 'com.aliucord.gradle' version '1.1.0'
}

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.0"

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'com.github.Aliucord:Aliucord:main-SNAPSHOT'
    compileOnly 'androidx.fragment:fragment:1.3.6'
    compileOnly 'com.google.android.material:material:1.4.0'
}

aliucord {
    author = "TuNombre"
    updateUrl = "https://githubusercontent.com"
}

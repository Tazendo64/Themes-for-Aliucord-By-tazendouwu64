name: Compilar Proyecto Aliucord

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite compilar manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Dar permisos a Gradle
      run: chmod +x gradlew

    - name: Compilar con Gradle
      run: ./gradlew build

    - name: Guardar archivo compilado
      uses: actions/upload-artifact@v4
      with:
        name: Aliucord-Build
        path: |
          build/outputs/
          build/libs/

name: Build Aliucord Plugin

on:
  push:
    branches: [ "WADDLE-DEE!" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install Gradle 7.4.2 Native
        run: |
          wget -q https://gradle.org
          sudo unzip -q gradle-7.4.2-bin.zip -d /opt
          echo "/opt/gradle-7.4.2/bin" >> $GITHUB_PATH

      - name: Build with Gradle
        run: |
          export PATH=/opt/gradle-7.4.2/bin:$PATH
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaddleDeePlugin
          path: app/build/outputs/aliucord/*.jar

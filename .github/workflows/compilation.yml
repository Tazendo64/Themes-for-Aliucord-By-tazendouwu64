name: Build Aliucord Plugin

on:
  push:
    branches:
      - 'WADDLE-DEE!'
  pull_request:
    branches:
      - 'WADDLE-DEE!'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle Estables
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compilar Proyecto
        run: gradle build --stacktrace

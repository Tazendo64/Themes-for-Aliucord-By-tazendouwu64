name: Build Aliucord Plugin

on:
  push:
    branches:
      - 'WADDLE-DEE!'
  pull_request:
    branches:
      - 'WADDLE-DEE!'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Corregir y Generar Gradle Wrapper
        run: gradle wrapper

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compilar Proyecto
        run: ./gradlew build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AliucordPlugin
          path: app/build/outputs/**

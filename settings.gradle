pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://aliucord.com' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.aliucord.gradle') {
                useModule('com.github.Aliucord:gradle-plugin:main-SNAPSHOT')
            }
        }
    }
}

dependencyResolutionManagement {
    // Corregido de forma nativa para Groovy usando la propiedad directa con String
    repositoriesMode = RepositoriesMode.PRESERVE_EXISTING_REPOS
    
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://aliucord.com' }
    }
}

include ':app'

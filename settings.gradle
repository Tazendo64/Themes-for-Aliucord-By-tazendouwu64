pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://aliucord.com" }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.aliucord.gradle") {
                useModule("com.github.Aliucord:gradle-plugin:main-SNAPSHOT")
            }
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://aliucord.com" }
    }
}

include ':app'

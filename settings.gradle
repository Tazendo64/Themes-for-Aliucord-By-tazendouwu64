pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://aliucord.com' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.aliucord.gradle') {
                useModule('com.github.Aliucord:gradle-plugin:main-SNAPSHOT')
            }
        }
    }
}

dependencyResolutionManagement {
    // Corregido: Se usa la constante de texto directa para evitar el fallo de compilación del script
    repositoriesMode.set(org.gradle.api.artifacts.dsl.DependencyResolutionManagement.RepositoriesMode.PRESERVE_EXISTING_REPOS)
    
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://aliucord.com' }
    }
}

include ':app'

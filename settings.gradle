pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://aliucord.com' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.aliucord.gradle') {
                useModule('com.github.Aliucord:gradle-plugin:main-SNAPSHOT')
            }
        }
    }
}

dependencyResolutionManagement {
    // CAMBIO CLAVE: Permite que convivan los repositorios centralizados con los de los scripts
    repositoriesMode.set(RepositoriesMode.PRESERVE_EXISTING_REPOS)
    
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://aliucord.com' }
    }
}

include ':app'
